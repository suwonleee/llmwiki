name: CI

# Two platforms, because this engine's hardest bugs are platform bugs it could not see.
#
# Until this file existed, every test ran only on the author's macOS machine, and the only
# OS-gated test was the macOS one. The Linux install branches — the systemd unit and the cron
# @reboot line, i.e. the entire Linux story the README promises — had never been executed by
# anything but judgment. Adding a runner is what turns "supported" into "checked".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · bun ${{ matrix.bun }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        bun: [latest]
        include:
          # The floor the installer accepts. Kept in the matrix so a feature that silently needs a
          # newer Bun (in-process zstd is the one that already did) fails here rather than in the
          # field, where it presents as "Codex sessions are missing" and nothing else.
          - os: ubuntu-latest
            bun: "1.2.0"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun tsc --noEmit

      - name: Shell syntax
        run: |
          for script in setup.sh daemon/*.sh hooks/*.sh; do
            bash -n "$script"
          done

      - name: Test
        run: bun test

  # Windows is a platform this engine SHIPS on, and until this job existed its only verification was
  # the author running things by hand. Two defects reached users that way, both invisible on POSIX
  # and both green in `doctor`: a CRLF checkout put the ownership marker above the YAML frontmatter,
  # so Codex refused all five skills — and the generated bodies told the agent to run `llmwiki`,
  # which on Windows is a /bin/sh launcher that PowerShell (the shell Codex and OpenCode hand the
  # agent's commands to) cannot execute.
  #
  # Deliberately NOT the whole suite: ~24% of it fails here on POSIX-only test scaffolding (rmSync
  # over a directory whose SQLite handle is still open, `bash` spawned from a native bun, symlinks
  # needing Developer Mode). Gating on a red suite would train everyone to ignore this job. It gates
  # on the platform contract instead: the checkout is what .gitattributes promises, and the pages
  # this engine GENERATES are ones the harness can actually load.
  windows:
    name: windows-latest · platform contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun tsc --noEmit

      - name: The checkout is LF, as .gitattributes promises
        shell: bash
        run: |
          set -eu
          for file in setup.sh daemon/install.sh hooks/sessionstart-inject.sh skill/wiki-save.md src/cli.ts; do
            if grep -qU $'\r' "$file"; then
              echo "::error::$file checked out with CRLF — .gitattributes is not taking effect"
              exit 1
            fi
          done

      - name: Frontmatter/marker regression
        run: bun test tests/harness-page-frontmatter.test.ts

      - name: The pages this engine generates are loadable here
        shell: bash
        run: |
          set -eu
          # A real wiring run against a throwaway HOME — the generated bytes are the artifact under
          # test, so nothing short of running the writers proves anything.
          HOME="$(cygpath -m "$(mktemp -d)")"
          export HOME
          export XDG_CONFIG_HOME="$HOME/.config"
          export LLMWIKI_BIN_DIR="$HOME/.local/bin"
          bun src/daemon/wire-codex.ts
          bun src/daemon/wire-opencode.ts
          for page in "$HOME"/.agents/skills/*/SKILL.md "$XDG_CONFIG_HOME"/opencode/commands/*.md; do
            if [ "$(head -c 3 "$page")" != "---" ]; then
              echo "::error::$page does not open with YAML frontmatter — the harness will refuse it"
              exit 1
            fi
            # `llmwiki` is not runnable from PowerShell here, so the body must carry the explicit
            # interpreter spelling instead.
            if ! grep -q 'src/cli\.ts' "$page"; then
              echo "::error::$page has no invocation this platform can run"
              exit 1
            fi
          done
          echo "checked $(ls "$HOME"/.agents/skills/*/SKILL.md "$XDG_CONFIG_HOME"/opencode/commands/*.md | wc -l) generated page(s)"
          # Codex runs a hook command through PowerShell, where `bash` resolves to nothing at all —
          # the hooks reported only "exited with code 1", with no way to see why.
          if grep -q '"command": *"bash ' "$HOME/.codex/hooks.json"; then
            echo "::error::the Codex hook names bash, which is not on the Windows PATH"
            exit 1
          fi
          grep -q 'src/cli\.ts' "$HOME/.codex/hooks.json" || {
            echo "::error::the Codex hook has no invocation this platform can run"
            exit 1
          }

  # The capture loop's one hard dependency is git, and its failure mode is silence: enrollment
  # cannot tell "git is missing" from "not a git worktree", so a machine without it captures
  # nothing while doctor stays green. This job asserts that the engine SAYS so.
  missing-git:
    name: doctor reports a missing git
    runs-on: ubuntu-latest
    container: oven/bun:1-alpine
    steps:
      - uses: actions/checkout@v4

      - name: Report the dependency instead of failing silently
        run: |
          set -eu
          # Alpine's bun image has no git. Run doctor with an empty PATH for the well-known
          # directories too, so tool-locate genuinely comes up empty.
          output="$(bun src/cli.ts doctor --harness all 2>&1 || true)"
          printf '%s\n' "$output"
          printf '%s' "$output" | grep -q 'git was not found' || {
            echo "::error::doctor did not report the missing git dependency"
            exit 1
          }
