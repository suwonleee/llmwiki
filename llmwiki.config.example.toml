# ══════════════════════════════════════════════════════════════════════════════════════
#  llmwiki.config.toml — your wiki's conventions
# ══════════════════════════════════════════════════════════════════════════════════════
#
#  You do NOT need this file. Without it the engine runs the stock structure and nothing
#  changes. Copy it to the engine clone root only when you want something different:
#
#      cp llmwiki.config.example.toml llmwiki.config.toml
#      llmwiki config <project-path>      # shows what the engine actually resolved
#
#  The [[category]] block below is ACTIVE and equals the built-in defaults — copying this
#  file changes nothing until you edit it. Everything else is commented out; uncomment
#  only what you want to change. A broken file never breaks a session: it is skipped,
#  defaults apply, and `llmwiki config` reports the warning.

config_version = 1


# ── 1. LANGUAGE ───────────────────────────────────────────────────────────────────────
#
#  This is NOT the language of your pages. Pages follow your conversation: talk in Korean
#  and you get Korean pages, switch to English and the next page is English. Nothing is
#  translated for you.
#
#  This sets the language the ENGINE writes in — the starter pages it seeds
#  (current-state.md · overview.md · log.md), the pointer it collapses overview.md to,
#  and the headers of the gap queue and quiz ledger. Those files live in your repo.
#
#  Leave it unset (or "auto") and the engine follows YOUR SESSION: it reads the language the
#  wiki's own content pages are written in, and before any page exists, the language you type
#  to your agent — code identifiers and paths are ignored, so a Korean sentence full of English
#  API names still reads as Korean. English is the last resort, not the default.
#
#  Set it to pin one language: "en" · "ko" · "ja" · "zh" (region tags like "zh-Hans" are fine;
#  an unsupported value falls back to English). Pinning is worth it on a team where members type
#  different languages. Engine MESSAGES (terminal, lint, session-start briefing) are translated
#  for en/ko only — with "ja"/"zh" those stay English.
#  One-off override: LLMWIKI_LANG=ja llmwiki init <path>   (env always wins)
#
# [wiki]
# lang = "auto"   # or "en" · "ko" · "ja" · "zh"


# ── 2. WIKI FOLDERS ───────────────────────────────────────────────────────────────────
#
#  The default structure under docs/wiki/, registered below so you can edit it in place:
#
#      1_direction/   domain=direction   review=human   big direction/strategy
#      2_milestone/   domain=milestone   review=model   work progress + what's next
#      3_decision/    domain=decision    review=model   ADR: problem → alternatives → choice
#      4_insight/     domain=insight     review=model   realizations · gotchas · lessons
#      5_topic/       FIXED — one living page per concept (consolidation target)
#      0_review/      FIXED — the human-judgment queue
#      6_quiz/        FIXED — your memory loop, never indexed
#
#  The numbered CATEGORY folders are yours to change; the three FIXED folders are the
#  engine's contract (consolidation target · human queue · never-indexed quiz layer) and
#  keep their stock names.
#
#  Each category:
#      dir     folder under docs/wiki (keep the number prefix: it is the reading order)
#      domain  the `domain:` value in a page's frontmatter (lowercase slug)
#      review  "human" → queued into 0_review for a person · "model" → the strong model
#              decides, no human sign-off
#      guide   one line telling the model what belongs here — the folder's character and
#              subject. Free text, any language; the WRITE prompts, cold-start rules and
#              the /wiki-* skills (via `llmwiki conventions`) all follow it.
#      prompt  (optional) the longer WRITE-prompt wording; omit it and `guide` is used
#      aliases (optional) extra domain spellings routed to this folder
#
#  The block below IS the built-in default — with these exact values the engine behaves
#  byte-identically to having no config at all. Edit `dir`/`guide`/`prompt` to change a
#  folder, or add/remove [[category]] blocks: declaring ANY [[category]] replaces the
#  whole default list (no partial merge — what you write is exactly what you get).

[[category]]
dir = "1_direction"
domain = "direction"
review = "human"
guide = "big direction/strategy — only the human confirms"
prompt = "the project's big direction/strategy, OR a shift in it this session (from what → to what, and why). Rare."

[[category]]
dir = "2_milestone"
domain = "milestone"
review = "model"
guide = "work progress + what's next"
prompt = "work progress + what's next: what was built / changed / measured this session, plus any remaining TODOs the human stated."

[[category]]
dir = "3_decision"
domain = "decision"
review = "model"
guide = "ADR: problem → alternatives → choice → consequences"
prompt = "an ADR: a problem the HUMAN faced this (or a past) session, the alternatives weighed, and the choice made (context / decision / alternatives / consequences)."

[[category]]
dir = "4_insight"
domain = "insight"
review = "model"
guide = "realizations · gotchas · lessons while working"
aliases = ["lesson"]
prompt = "a realization or lesson surfaced while working with the human (a gotcha, a non-obvious learning, what made the result better) that helps future work."

# Quiz session size (the 6_quiz folder itself is fixed):
# [quiz]
# questions = 3            # per /wiki-quiz session (the engine caps a session at 7)

# Personal folders inside a shared wiki: indexed and searched for you, but auto-gitignored
# so nothing in them is committed. Must not collide with the names above.
# [private]
# dirs = ["9_personal"]


# ── 3. MODELS ─────────────────────────────────────────────────────────────────────────
#
#  Only two passes call a model (capture, reading, search and lint never do):
#  `light` drafts pages, `heavy` runs the verification gate and the semantic review.
#  Order: env (LLMWIKI_MODEL_LIGHT / _HEAVY) > this file > built-in default.
#
# [models]
# light = "claude-sonnet-5"
# heavy = "claude-opus-4-8"


# ── 4. WORDING ────────────────────────────────────────────────────────────────────────
#
#  The three core files are FIXED structure, like the folders marked FIXED above:
#  current-state.md (the one-glance L0 injected at session start) · overview.md (the
#  entry point) · log.md (the append-only ledger).

# Old folders to keep scanning after a rename, so earlier pages stay findable.
# legacy_dirs = ["milestones", "insights", "decisions", "directions"]

# Wording you don't want → what to use instead. Advisory: lint warns, nothing is blocked.
# [lint.banned_terms]
# "진북" = "방향성"
# "distill" = "update / 업데이트"


# ── 5. ONE CONFIG PER PROJECT (optional) ──────────────────────────────────────────────
#
#  One engine clone can serve projects with different conventions: put *.toml files under
#  <clone>/configs/ instead of using this single root file.
#
#    • with `applies_to = [...]` → governs those folders and everything beneath them
#      (longest match wins; `~` expands)
#    • without it → the default for every project (canonical: configs/default.toml)
#    • precedence: applies_to match → configs/default.toml → this file → built-in defaults
#    • the matched path is the one your agent session reports (CLAUDE_PROJECT_DIR, or cwd)
#
#  Only valid inside a configs/ file, not here:
# applies_to = ["~/work/repo-a", "/absolute/path/team-wikis"]
#
#  Team sharing: commit the file to your team's engine fork; members `git pull`. Note that
#  `configs/*.toml` is gitignored by default (user-local) — track a team config explicitly
#  with `git add -f configs/<team>.toml`.
